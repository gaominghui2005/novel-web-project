<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=375, initial-scale=1">
  <title>登录 · 听书</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .login-wrap { padding: 60px 24px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
    .login-card { width: 100%; background: rgba(255,255,255,0.05); padding: 24px; border-radius: 16px; }
    .login-card h2 { margin: 0 0 8px; font-size: 22px; }
    .login-card p { margin: 0 0 20px; font-size: 13px; opacity: 0.7; }
    .login-card input {
      width: 100%; padding: 12px 14px; margin-bottom: 12px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.2); color: white; font-size: 15px;
    }
    .login-card button {
      width: 100%; padding: 12px; border: 0; background: linear-gradient(90deg, #5b5bff, #ff66cc);
      color: white; border-radius: 10px; font-size: 16px; cursor: pointer;
    }
    .login-card .switch { font-size: 13px; opacity: 0.7; margin-top: 10px; text-align: center; }
    .login-card .err { color: #ff7676; font-size: 13px; min-height: 18px; }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="phone-screen">
      <div class="login-wrap">
        <div class="login-card">
          <h2 id="title">登录 · 听书</h2>
          <p id="subtitle">不存在账号会自动注册</p>
          <input id="phone" placeholder="手机号" inputmode="numeric" maxlength="11" autocomplete="tel">
          <input id="password" type="password" placeholder="密码 (6位以上)" autocomplete="current-password">
          <div class="err" id="err"></div>
          <button id="submit">进入</button>
          <div class="switch" id="switch">已有账号?这里直接登录 · 一个账号就是一个手机号</div>
        </div>
      </div>
    </div>
  </div>
  <script type="module">
    import { authLoginOrRegister, authMe, authLogout } from './api-client.js';

    const $ = (s) => document.querySelector(s);
    const err = (m) => ($('#err').textContent = m);

    async function go() {
      try {
        const me = await authMe();
        if (me?.user) {
          location.href = './me.html';
        } else {
          $('#phone').focus();
        }
      } catch {}
    }

    $('#submit').addEventListener('click', async () => {
      err('');
      const phone = $('#phone').value.trim();
      const password = $('#password').value;
      if (!/^1[3-9]\d{9}$/.test(phone)) return err('手机号格式不对');
      if (password.length < 6) return err('密码至少 6 位');
      try {
        await authLoginOrRegister(phone, password);
        location.href = './me.html';
      } catch (e) { err(e.message); }
    });

    $('#phone').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#password').focus(); });
    $('#password').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#submit').click(); });

    // 自动登出按钮(开发用)
    window.__logout = async () => { await authLogout(); location.reload(); };

    go();
  </script>
</body>
</html>
