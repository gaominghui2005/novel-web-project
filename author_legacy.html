<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=375">
  <title>作者工作台 · 听书</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* === 作者专属样式（沉浸式写作）=== */
    body.author .phone-frame { box-shadow: 0 30px 80px rgba(167,139,250,.18); }
    body.author .phone-screen {
      background:
        radial-gradient(circle at 30% 20%, rgba(167,139,250,.05), transparent 50%),
        radial-gradient(circle at 70% 80%, rgba(124,158,255,.04), transparent 50%);
      /* 让 position:fixed 元素（modal-mask/ch-pop）被限制在 phone-screen 内 */
      transform: translateZ(0);
      contain: layout paint;
    }

    /* 响应式：窄屏适配 */
    @media (max-width: 480px), (max-height: 600px) {
      html, body { overflow: auto; }
      body.author { align-items: stretch; justify-content: stretch; }
      body.author .phone-frame { width: 100vw; height: 100vh; min-height: 100dvh; padding: 0; border-radius: 0; box-shadow: none; }
      body.author .phone-screen { border-radius: 0; }
      .modal { width: calc(100% - 24px); }
    }
    @media (min-width: 481px) and (max-width: 900px) {
      body.author { transform: scale(0.9); transform-origin: center center; }
    }

    .author-shell { display: flex; flex-direction: column; height: 100%; }

    /* 顶部 AppBar */
    .a-appbar {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 14px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
    }
    .a-appbar .menu-btn {
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      background: var(--gray-1); border-radius: 8px; cursor: pointer; font-size: 18px;
    }
    .a-appbar .title { font-size: 16px; font-weight: 600; flex: 1; }
    .a-appbar .meta {
      font-size: 11px; color: var(--text-3);
      display: flex; align-items: center; gap: 8px;
    }
    .a-appbar .meta b { color: var(--text); font-weight: 600; font-size: 13px; }
    .a-appbar .exit {
      font-size: 12px; color: var(--danger); padding: 6px 10px;
      border-radius: 6px; cursor: pointer;
    }

    /* 抽屉（左侧滑出）*/
    .a-drawer-mask {
      position: absolute; inset: 0;
      background: rgba(0,0,0,.5);
      opacity: 0; pointer-events: none;
      transition: opacity .2s;
      z-index: 30;
    }
    .a-drawer-mask.show { opacity: 1; pointer-events: auto; }
    .a-drawer {
      position: absolute; left: 0; top: 0; bottom: 0;
      width: 78%; max-width: 320px;
      background: var(--bg);
      border-right: 1px solid var(--border);
      transform: translateX(-100%);
      transition: transform .25s;
      z-index: 31;
      display: flex; flex-direction: column;
    }
    .a-drawer.show { transform: translateX(0); }
    .a-drawer-head {
      padding: 18px 18px 14px;
      background: linear-gradient(135deg, rgba(167,139,250,.12), rgba(124,158,255,.08));
      border-bottom: 1px solid var(--border);
    }
    .a-drawer-head .nm { font-size: 16px; font-weight: 700; }
    .a-drawer-head .id { font-size: 12px; color: var(--text-3); margin-top: 2px; }
    .a-drawer-head .stats {
      display: flex; gap: 14px;
      margin-top: 12px;
      font-size: 11px; color: var(--text-2);
    }
    .a-drawer-head .stats span b { color: var(--text); font-weight: 700; font-size: 14px; display: block; }
    .a-drawer-list {
      flex: 1; overflow-y: auto;
      padding: 8px 0;
    }
    .a-drawer-list .book-item {
      display: flex; gap: 10px; align-items: center;
      padding: 10px 16px;
      cursor: pointer;
      border-left: 3px solid transparent;
    }
    .a-drawer-list .book-item:hover { background: var(--bg-card); }
    .a-drawer-list .book-item.active {
      background: rgba(124,158,255,.10);
      border-left-color: var(--green);
    }
    .a-drawer-list .book-item img {
      width: 36px; height: 48px; border-radius: 4px; object-fit: cover; background: var(--gray-1);
    }
    .a-drawer-list .book-item .nm {
      font-size: 14px; font-weight: 600;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .a-drawer-list .book-item .mt {
      font-size: 11px; color: var(--text-3);
      display: flex; align-items: center; gap: 6px;
    }
    .a-drawer-list .book-item .status-dot {
      width: 6px; height: 6px; border-radius: 50%;
    }
    .status-dot.s_连载中 { background: #34D399; }
    .status-dot.s_断更   { background: #FBBF24; }
    .status-dot.s_已完结 { background: #8888A8; }
    .a-drawer-foot {
      padding: 12px 14px;
      border-top: 1px solid var(--border);
    }
    .a-drawer-foot button {
      width: 100%;
      padding: 10px;
      background: linear-gradient(135deg, var(--green), var(--accent));
      color: white; border: none; border-radius: 8px;
      font-size: 13px; font-weight: 600; cursor: pointer;
    }

    /* 写作主区 */
    .a-main {
      flex: 1;
      display: flex; flex-direction: column;
      overflow: hidden;
      background: var(--bg);
    }
    .a-book-head {
      padding: 16px 18px 6px;
      border-bottom: 1px solid var(--border);
    }
    .a-book-head .title-row {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 6px;
    }
    .a-book-head .title-row h2 {
      font-size: 18px; font-weight: 700; flex: 1;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .a-book-head .title-row .status-badge {
      font-size: 11px; padding: 3px 8px; border-radius: 10px;
      background: var(--gray-1); color: var(--text-2);
      cursor: pointer;
    }
    .a-book-head .title-row .status-badge.s_连载中    { background: rgba(52,211,153,.15);  color: #34D399; }
    .a-book-head .title-row .status-badge.s_断更      { background: rgba(251,191,36,.15);  color: #FBBF24; }
    .a-book-head .title-row .status-badge.s_已完结    { background: rgba(136,136,168,.18); color: #8888A8; }
    .a-book-head .meta-row {
      font-size: 12px; color: var(--text-3);
      display: flex; gap: 12px;
    }

    /* 章节切换 Tab */
    /* 章节切换 Tab：可换行，+ 号钉在右侧 */
    .ch-tabs {
      display: flex; flex-wrap: wrap; gap: 6px;
      padding: 8px 14px;
      flex-shrink: 0;
      align-items: center;
    }
    .ch-tabs::-webkit-scrollbar { display: none; }
    .ch-tab {
      flex: 0 1 auto;
      max-width: 100%;
      padding: 6px 12px;
      font-size: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      cursor: pointer;
      color: var(--text-2);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .ch-tab.active {
      background: var(--green);
      color: white;
      border-color: var(--green);
    }
    .ch-tab.add {
      background: transparent;
      border-style: dashed;
      color: var(--text-3);
      flex: 0 0 auto;
    }

    /* 写作区 */
    .a-write-area {
      flex: 1;
      display: flex; flex-direction: column;
      padding: 16px 22px 8px;
      overflow: hidden;
    }
    .a-write-title {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 20px;
      font-weight: 700;
      padding: 4px 0;
      margin-bottom: 8px;
      font-family: inherit;
    }
    .a-write-title::placeholder { color: var(--text-3); }
    .a-write-body {
      flex: 1;
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      color: var(--text);
      font-size: 16px;
      line-height: 1.9;
      padding: 0;
      font-family: inherit;
    }
    .a-write-body::placeholder { color: var(--text-3); }

    /* 底部状态条 */
    .a-footbar {
      flex-shrink: 0;
      display: flex; align-items: center; gap: 12px;
      padding: 8px 14px;
      background: var(--bg-card);
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-3);
    }
    .a-footbar .save-state {
      flex: 1;
    }
    .a-footbar .save-state.dirty { color: var(--warn); }
    .a-footbar .save-state.saved { color: var(--accent-2); }
    .a-footbar button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-2);
      padding: 5px 10px;
      font-size: 11px;
      border-radius: 6px;
      cursor: pointer;
    }
    .a-footbar button.primary {
      background: var(--green); color: white; border: none;
      font-weight: 600;
    }
    .a-footbar button:hover { background: var(--bg-card-hover); color: var(--text); }

    /* 章节右键 / 操作弹层 */
    .ch-actions-pop {
      position: absolute; right: 14px; top: 70px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 0;
      box-shadow: 0 8px 24px rgba(0,0,0,.4);
      z-index: 25;
      min-width: 120px;
    }
    .ch-actions-pop .item {
      padding: 10px 14px;
      font-size: 13px;
      cursor: pointer;
    }
    .ch-actions-pop .item:hover { background: var(--bg-card-hover); }
    .ch-actions-pop .item.danger { color: var(--danger); }

    /* 设置弹层（编辑书信息） */
    .modal-mask {
      position: absolute; inset: 0;
      background: rgba(0,0,0,.55);
      z-index: 40;
      display: flex; align-items: center; justify-content: center;
    }
    .modal {
      width: calc(100% - 32px); max-width: 360px;
      background: var(--bg-card);
      border-radius: 14px;
      border: 1px solid var(--border);
      padding: 18px;
      max-height: 80%;
      overflow-y: auto;
    }
    .modal h3 { font-size: 15px; font-weight: 700; margin-bottom: 12px; }
    .modal .ep-field { margin: 12px 0; }

    /* 封面选择器 */
    .cv-current {
      display: flex; align-items: center; gap: 12px;
      padding: 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 10px;
    }
    .cv-current img {
      width: 56px; height: 76px; border-radius: 6px;
      object-fit: cover; background: var(--gray-1);
    }
    .cv-current .cv-actions { flex: 1; display: flex; justify-content: flex-end; }
    .cv-upload {
      padding: 8px 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      color: var(--text-2);
    }
    .cv-upload:hover { background: var(--bg-card-hover); color: var(--text); }
    .cv-grid {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;
    }
    .cv-cell {
      aspect-ratio: 3/4;
      border-radius: 6px;
      overflow: hidden;
      border: 2px solid transparent;
      cursor: pointer;
      background: var(--gray-1);
    }
    .cv-cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .cv-cell:hover { border-color: var(--green-light); }
    .cv-cell.active { border-color: var(--green); }

    .modal-foot {
      display: flex; gap: 8px;
      margin-top: 14px;
    }
    .modal-foot button {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
    }
    .modal-foot button.primary {
      background: linear-gradient(135deg, var(--green), var(--accent));
      border: none;
      color: white;
      font-weight: 600;
    }

    /* 状态选择器（弹层里的 3 选项） */
    .status-choices { display: flex; gap: 8px; margin: 12px 0; }
    .status-choices .sc {
      flex: 1;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      font-size: 13px;
    }
    .status-choices .sc:hover { background: var(--bg-card-hover); }
    .status-choices .sc.s_连载中.active  { background: rgba(52,211,153,.15);  border-color: #34D399; color: #34D399; }
    .status-choices .sc.s_断更.active    { background: rgba(251,191,36,.15);  border-color: #FBBF24; color: #FBBF24; }
    .status-choices .sc.s_已完结.active  { background: rgba(136,136,168,.18); border-color: #8888A8; color: #E8E8F0; }

    /* 沉浸模式：隐藏顶栏、底栏、章节 Tab */
    body.zen .a-appbar,
    body.zen .a-book-head .meta-row,
    body.zen .ch-tabs,
    body.zen .a-footbar {
      display: none;
    }
    body.zen .a-book-head { padding-bottom: 16px; }
    body.zen .a-write-area { padding: 8px 22px; }

    /* 空状态（没选书） */
    .empty-main {
      flex: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 40px 24px;
      color: var(--text-3);
      text-align: center;
    }
    .empty-main .ic { font-size: 50px; opacity: .4; margin-bottom: 12px; }
    .empty-main button {
      margin-top: 16px;
      padding: 10px 20px;
      background: linear-gradient(135deg, var(--green), var(--accent));
      color: white; border: none;
      border-radius: 10px;
      font-size: 13px; font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body class="author">
  <div class="phone-frame">
    <div class="phone-screen">
      <div class="app-body" id="app-body"></div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script src="data.js"></script>
  <script>
    const $  = s => document.querySelector(s);
    const $$ = s => Array.from(document.querySelectorAll(s));
    const APP_BODY = () => $('#app-body');

    function toast(msg, ms = 1500) {
      const t = $('#toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(t._tid);
      t._tid = setTimeout(() => t.classList.remove('show'), ms);
    }
    function escapeAttr(s) {
      return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    function escapeText(s) {
      return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    function pickCover() {
      // 随机选一张已有封面，让新书看起来不一样
      const ids = ['b1','b2','b3','b4','b5','b6','b7','b8','b9','b10','b11','b12','b13','b14','b15'];
      const id = ids[Math.floor(Math.random() * ids.length)];
      return 'assets/book_' + id + '.svg';
    }
    function wordCount(s) {
      // 中文按字符数（含标点），英文按空格分
      const t = String(s || '').trim();
      if (!t) return 0;
      // 每汉字算 1，ascii 段按单词
      const cjk = (t.match(/[一-龥]/g) || []).length;
      const other = t.length - cjk;
      return cjk + Math.round(other / 6);
    }
    function fmtStatus(s) {
      const m = ({'连载中':'连载','断更':'断更','已完结':'完结'})[s] || s;
      return m;
    }

    /* === 守卫 === */
    let _currentBookId = null;
    let _currentChapterId = null;
    let _drawerOpen = false;

    function loginGate() {
      return `
        <div class="login-page">
          <div class="logo">听书</div>
          <h1>作者登录</h1>
          <div class="login-form">
            <input type="text" id="au_user" value="author">
            <input type="password" id="au_pass" value="123456">
          </div>
          <div class="login-hint">提示：账号 author / 123456</div>
          <button class="login-btn" onclick="doAuLogin()">进入工作台</button>
          <div style="margin-top:14px;font-size:12px;">
            <a href="index.html" style="color:var(--text-3);">← 返回听书</a>
          </div>
        </div>
      `;
    }
    window.doAuLogin = function () {
      const u = $('#au_user').value.trim();
      const p = $('#au_pass').value;
      const acc = ACCOUNTS.find(a => a.username === u && a.password === p && a.role === 'author');
      if (!acc) { toast('账号错误'); return; }
      CURRENT_USER.role = 'author';
      CURRENT_USER.name = acc.name;
      CURRENT_USER.authorId = acc.authorId;
      saveUser();
      render(workspace(), { hideTab: true });
    };

    function workspace() {
      const me = CURRENT_USER;
      const authorId = me.authorId || 'a1';
      const a = AUTHORS.find(x => x.id === authorId) || AUTHORS[0];
      const myBooks = getAllBooks().filter(b => b.authorId === authorId);

      // 数据面板
      let totalWords = 0, totalChapters = 0;
      myBooks.forEach(b => {
        totalChapters += (getAllChapters()[b.id] || []).length;
        (getAllChapters()[b.id] || []).forEach(c => { totalWords += wordCount(c.text); });
      });

      // 当前作品
      let curBook = null;
      if (_currentBookId) curBook = myBooks.find(b => b.id === _currentBookId);
      if (!curBook && myBooks.length > 0) curBook = myBooks[0];
      if (curBook) _currentBookId = curBook.id;

      return `
        <div class="author-shell">
          <!-- AppBar -->
          <div class="a-appbar">
            <span class="menu-btn" onclick="toggleDrawer()">☰</span>
            <div class="title">写作</div>
            <div class="meta">
              <span>总字数 <b>${totalWords.toLocaleString()}</b></span>
              <span>章节 <b>${totalChapters}</b></span>
              <span>作品 <b>${myBooks.length}</b></span>
            </div>
            <span class="exit" onclick="logoutAuthor()">退出</span>
          </div>

          <!-- 抽屉 -->
          <div class="a-drawer-mask" onclick="toggleDrawer()"></div>
          <div class="a-drawer" id="drawer">
            <div class="a-drawer-head">
              <div class="nm">${a.name}</div>
              <div class="id">@${CURRENT_USER.name || 'author'}</div>
              <div class="stats">
                <span><b>${myBooks.length}</b>作品</span>
                <span><b>${totalChapters}</b>章节</span>
                <span><b>${totalWords.toLocaleString()}</b>字</span>
              </div>
            </div>
            <div class="a-drawer-list">
              ${myBooks.length === 0
                ? '<div style="text-align:center;padding:30px 10px;color:var(--text-3);font-size:13px;">还没有作品<br>点击下方按钮开始</div>'
                : myBooks.map(b => {
                    const chs = (getAllChapters()[b.id] || []).length;
                    return `
                      <div class="book-item ${b.id === _currentBookId ? 'active' : ''}" onclick="pickBook('${b.id}')">
                        <img src="${b.cover}" alt="">
                        <div style="flex:1;min-width:0;">
                          <div class="nm">${b.title}</div>
                          <div class="mt">
                            <span class="status-dot s_${b.status}"></span>
                            ${fmtStatus(b.status)} · ${chs}章
                          </div>
                        </div>
                      </div>
                    `;
                  }).join('')
              }
            </div>
            <div class="a-drawer-foot">
              <button onclick="newBookModal()">+ 新建作品</button>
            </div>
          </div>

          <!-- 主区 -->
          ${curBook ? bookMain(curBook) : emptyMain()}
        </div>
      `;
    }

    function emptyMain() {
      return `
        <div class="empty-main">
          <div class="ic">✍</div>
          <div>还没有作品</div>
          <button onclick="newBookModal()">+ 创建第一本</button>
        </div>
      `;
    }

    /* === 单本书主区 === */
    function bookMain(b) {
      const chs = getAllChapters()[b.id] || [];
      // 当前章节
      let cur = chs.find(c => c.id === _currentChapterId);
      if (!cur && chs.length > 0) { cur = chs[0]; _currentChapterId = cur.id; }

      return `
        <div class="a-main" onclick="closeChPop()">
          <div class="a-book-head">
            <div class="title-row">
              <h2 onclick="event.stopPropagation();openBookSettings('${b.id}')">${b.title}</h2>
              <span class="status-badge s_${b.status}" onclick="event.stopPropagation();openStatusPicker('${b.id}')">${fmtStatus(b.status)}</span>
            </div>
            <div class="meta-row">
              <span>${findGenre(b.genreId)?.name || ''}</span>
              <span>${chs.length} 章</span>
              <span>${wordCount(chs.map(c=>c.text).join(''))} 字</span>
              <span style="cursor:pointer;" onclick="event.stopPropagation();toggleZen()">⚡ 沉浸</span>
              <span style="cursor:pointer;margin-left:auto;" onclick="event.stopPropagation();openBookSettings('${b.id}')">⚙ 设置</span>
            </div>
          </div>

          <div class="ch-tabs">
            ${chs.map(c => `
              <div class="ch-tab ${c.id === _currentChapterId ? 'active' : ''}" onclick="pickChapter('${c.id}')" oncontextmenu="event.preventDefault();showChPop(event,'${b.id}','${c.id}')">
                ${c.title}
              </div>
            `).join('')}
            <div class="ch-tab add" onclick="newChapterInline('${b.id}')">+</div>
          </div>

          ${cur ? writeArea(b, cur) : '<div class="empty-main"><div class="ic">📝</div><div>还没有章节</div><button onclick="newChapterInline(\'' + b.id + '\')">写第一章</button></div>'}
        </div>
      `;
    }

    /* === 写作区 === */
    function writeArea(b, c) {
      return `
        <div class="a-write-area">
          <input class="a-write-title" id="w_title" value="${escapeAttr(c.title)}" placeholder="章节标题">
          <textarea class="a-write-body" id="w_body" placeholder="在这里开始你的故事…">${escapeText(c.text)}</textarea>
        </div>
        <div class="a-footbar">
          <span class="save-state saved" id="save_state">已保存</span>
          <span>${wordCount(c.text)} 字</span>
          <span>${new Date().toLocaleDateString('zh-CN')}</span>
          <span style="flex:1"></span>
          <button class="primary" onclick="quickSave()">保存</button>
        </div>
      `;
    }

    /* === 行为 === */
    window.toggleDrawer = function () {
      _drawerOpen = !_drawerOpen;
      const m = document.querySelector('.a-drawer-mask');
      const d = document.querySelector('.a-drawer');
      if (m) m.classList.toggle('show', _drawerOpen);
      if (d) d.classList.toggle('show', _drawerOpen);
    };
    window.pickBook = function (bid) {
      _currentBookId = bid;
      _currentChapterId = null;
      _drawerOpen = false;
      render(workspace(), { hideTab: true });
    };
    window.pickChapter = function (cid) {
      // 先尝试保存当前
      if (_currentChapterId && _currentChapterId !== cid) quickSave();
      _currentChapterId = cid;
      render(workspace(), { hideTab: true });
    };

    window.toggleZen = function () {
      document.body.classList.toggle('zen');
    };

    /* === 章节右键菜单 === */
    let _chPopVisible = false;
    window.showChPop = function (ev, bid, cid) {
      ev.stopPropagation();
      _chPopVisible = true;
      let pop = document.getElementById('ch_pop');
      if (!pop) {
        pop = document.createElement('div');
        pop.id = 'ch_pop';
        pop.className = 'ch-actions-pop';
        document.querySelector('.phone-screen').appendChild(pop);
      }
      pop.innerHTML = `
        <div class="item" onclick="event.stopPropagation();editChapter('${bid}','${cid}')">编辑章节</div>
        <div class="item" onclick="event.stopPropagation();renameChapter('${bid}','${cid}')">重命名</div>
        <div class="item danger" onclick="event.stopPropagation();delChapter('${bid}','${cid}')">删除章节</div>
      `;
      const r = ev.target.getBoundingClientRect();
      pop.style.left = Math.min(window.innerWidth - 140, r.left) + 'px';
      pop.style.top  = (r.bottom + 4) + 'px';
      pop.style.display = 'block';
    };
    window.closeChPop = function () {
      const pop = document.getElementById('ch_pop');
      if (pop) pop.style.display = 'none';
    };

    /* === 状态切换 === */
    window.openStatusPicker = function (bid) {
      const b = findBook(bid);
      const cur = b.status;
      const modal = document.createElement('div');
      modal.className = 'modal-mask';
      modal.innerHTML = `
        <div class="modal" onclick="event.stopPropagation()">
          <h3>切换书籍状态</h3>
          <div class="status-choices">
            <div class="sc s_连载中 ${cur==='连载中'?'active':''}" onclick="pickStatus('${bid}','连载中')">连载中</div>
            <div class="sc s_断更 ${cur==='断更'?'active':''}" onclick="pickStatus('${bid}','断更')">断更</div>
            <div class="sc s_已完结 ${cur==='已完结'?'active':''}" onclick="pickStatus('${bid}','已完结')">已完结</div>
          </div>
          <div class="modal-foot">
            <button onclick="this.closest('.modal-mask').remove()">取消</button>
          </div>
        </div>
      `;
      document.querySelector('.phone-screen').appendChild(modal);
    };
    window.pickStatus = function (bid, status) {
      const b = findBook(bid);
      if (!b) return;
      const extra = loadExtraBooks();
      const idx = extra.findIndex(x => x.id === bid);
      if (idx >= 0) {
        extra[idx].status = status;
        saveExtraBooks(extra);
      } else {
        const ov = loadOverrides();
        ov.books = ov.books || {};
        ov.books[bid] = Object.assign({}, ov.books[bid] || {}, { status });
        saveOverrides(ov);
      }
      toast(`已标记为：${status}`);
      document.querySelectorAll('.modal-mask').forEach(m => m.remove());
      render(workspace(), { hideTab: true });
    };

    /* === 书籍设置（弹层编辑书信息） === */
    window.openBookSettings = function (bid) {
      const b = findBook(bid);
      if (!b) return;
      const genres = GENRES.map(g => `<option value="${g.id}" ${b.genreId === g.id ? 'selected' : ''}>${g.name}</option>`).join('');
      // 15 张候选封面
      const coverIds = ['b1','b2','b3','b4','b5','b6','b7','b8','b9','b10','b11','b12','b13','b14','b15'];
      const coverGrid = coverIds.map(id => `
        <div class="cv-cell ${('assets/book_' + id + '.svg') === b.cover ? 'active' : ''}" data-cv="assets/book_${id}.svg" onclick="selectCover(this,'${id}')">
          <img src="assets/book_${id}.svg" alt="">
        </div>
      `).join('');
      const modal = document.createElement('div');
      modal.className = 'modal-mask';
      modal.innerHTML = `
        <div class="modal" onclick="event.stopPropagation()">
          <h3>编辑作品信息</h3>
          <div class="ep-field">
            <label>书名</label>
            <input id="bk_title" value="${escapeAttr(b.title)}">
          </div>
          <div class="ep-field">
            <label>分类</label>
            <select id="bk_genre">${genres}</select>
          </div>
          <div class="ep-field">
            <label>简介</label>
            <textarea id="bk_intro" style="min-height:120px;">${escapeText(b.intro)}</textarea>
          </div>
          <div class="ep-field">
            <label>封面</label>
            <div class="cv-current">
              <img id="bk_cover_preview" src="${escapeAttr(b.cover)}" alt="">
              <div class="cv-actions">
                <label class="cv-upload">
                  + 上传本地图
                  <input type="file" accept="image/*" id="bk_cover_upload" style="display:none;" onchange="uploadCover(this)">
                </label>
              </div>
            </div>
            <div class="cv-grid">${coverGrid}</div>
            <div class="hint">点击候选封面即时切换，或上传本地图（将保存到本作品）</div>
          </div>
          <div class="modal-foot">
            <button onclick="delBook('${bid}');this.closest('.modal-mask').remove();" style="color:var(--danger);border-color:var(--danger);">删除作品</button>
            <button onclick="saveBookSettings('${bid}')" class="primary">保存</button>
          </div>
        </div>
      `;
      document.querySelector('.phone-screen').appendChild(modal);
      // 暂存选中的 cover（默认当前）
      modal._cover = b.cover;
    };
    // 选中候选封面
    window.selectCover = function (cell, id) {
      const modal = cell.closest('.modal-mask');
      if (!modal) return;
      modal._cover = 'assets/book_' + id + '.svg';
      const preview = modal.querySelector('#bk_cover_preview');
      if (preview) preview.src = modal._cover;
      modal.querySelectorAll('.cv-cell').forEach(c => c.classList.toggle('active', c === cell));
    };
    // 上传本地图，base64 存到 _cover
    window.uploadCover = function (input) {
      const file = input.files && input.files[0];
      if (!file) return;
      if (file.size > 2 * 1024 * 1024) { toast('图片不能超过 2MB'); return; }
      const reader = new FileReader();
      reader.onload = function (e) {
        const dataUrl = e.target.result;
        const modal = input.closest('.modal-mask');
        if (modal) {
          modal._cover = dataUrl;
          const preview = modal.querySelector('#bk_cover_preview');
          if (preview) preview.src = dataUrl;
          modal.querySelectorAll('.cv-cell').forEach(c => c.classList.remove('active'));
        }
      };
      reader.readAsDataURL(file);
    };
    window.saveBookSettings = function (bid) {
      const title = ($('#bk_title').value || '').trim();
      const intro = ($('#bk_intro').value || '').trim();
      const genreId = $('#bk_genre').value;
      const modal = document.querySelector('.modal-mask');
      const cover = (modal && modal._cover) || null;
      if (!title) { toast('书名不能为空'); return; }
      const extra = loadExtraBooks();
      const idx = extra.findIndex(x => x.id === bid);
      if (idx >= 0) {
        extra[idx].title = title;
        extra[idx].intro = intro;
        extra[idx].genreId = genreId;
        if (cover) extra[idx].cover = cover;
        saveExtraBooks(extra);
      } else {
        const ov = loadOverrides();
        ov.books = ov.books || {};
        const patch = { title, intro, genreId };
        if (cover) patch.cover = cover;
        ov.books[bid] = Object.assign({}, ov.books[bid] || {}, patch);
        saveOverrides(ov);
      }
      toast('已保存');
      document.querySelectorAll('.modal-mask').forEach(m => m.remove());
      render(workspace(), { hideTab: true });
    };
    window.delBook = function (bid) {
      if (!confirm('确认删除整本书？此操作不可恢复')) return;
      // 删 extra + 加 removedBooks
      saveExtraBooks(loadExtraBooks().filter(b => b.id !== bid));
      const ov = loadOverrides();
      ov.removedBooks = ov.removedBooks || [];
      if (!ov.removedBooks.includes(bid)) ov.removedBooks.push(bid);
      // 同时清理所有 override
      if (ov.removed) delete ov.removed[bid];
      if (ov.books)  delete ov.books[bid];
      if (ov.updates) {
        (CHAPTERS[bid] || []).forEach(c => { delete ov.updates[c.id]; });
        Object.keys(loadExtraChapters()[bid] || {}).forEach(cid => delete ov.updates[cid]);
      }
      saveOverrides(ov);
      // 切到另一本
      const me = CURRENT_USER;
      const remaining = getAllBooks().filter(b => b.authorId === me.authorId && b.id !== bid);
      _currentBookId = remaining[0]?.id || null;
      _currentChapterId = null;
      toast('已删除');
      render(workspace(), { hideTab: true });
    };

    /* === 新建作品（弹层） === */
    window.newBookModal = function () {
      const genres = GENRES.map(g => `<option value="${g.id}">${g.name}</option>`).join('');
      const modal = document.createElement('div');
      modal.className = 'modal-mask';
      modal.innerHTML = `
        <div class="modal" onclick="event.stopPropagation()">
          <h3>新建作品</h3>
          <div class="ep-field">
            <label>书名</label>
            <input id="nb_title" placeholder="起一个响亮的名字">
          </div>
          <div class="ep-field">
            <label>分类</label>
            <select id="nb_genre">${genres}</select>
          </div>
          <div class="ep-field">
            <label>简介</label>
            <textarea id="nb_intro" style="min-height:120px;" placeholder="一句话讲清楚是什么故事"></textarea>
          </div>
          <div class="modal-foot">
            <button onclick="this.closest('.modal-mask').remove()">取消</button>
            <button onclick="createBook()" class="primary">创建</button>
          </div>
        </div>
      `;
      document.querySelector('.phone-screen').appendChild(modal);
      setTimeout(() => $('#nb_title')?.focus(), 50);
    };
    window.createBook = function () {
      const title = ($('#nb_title').value || '').trim();
      const intro = ($('#nb_intro').value || '').trim();
      const genreId = $('#nb_genre').value;
      if (!title) { toast('请填写书名'); return; }
      if (!intro) { toast('请填写简介'); return; }
      const authorId = CURRENT_USER.authorId || 'a1';
      const id = 'b_' + Date.now();
      const extra = loadExtraBooks();
      extra.push({
        id, title, authorId,
        genreId,
        cover: pickCover(),
        intro, status: '连载中', words: '0.1 万', hot: 0,
      });
      saveExtraBooks(extra);
      _currentBookId = id;
      _currentChapterId = null;
      document.querySelectorAll('.modal-mask').forEach(m => m.remove());
      _drawerOpen = false;
      toast('已创建');
      render(workspace(), { hideTab: true });
    };

    /* === 章节 === */
    window.newChapterInline = function (bid) {
      const chs = getAllChapters()[bid] || [];
      const idx = chs.length + 1;
      const newCh = { id: `${bid}_c${Date.now()}`, title: `第${idx}章 · 未命名`, text: '' };
      const extra = loadExtraChapters();
      const list = extra[bid] || [];
      list.push(newCh);
      extra[bid] = list;
      saveExtraChapters(extra);
      _currentChapterId = newCh.id;
      toast('新章节已创建');
      render(workspace(), { hideTab: true });
      // 聚焦标题 + 选中全文让用户直接覆盖
      setTimeout(() => {
        const t = $('#w_title');
        if (t) { t.focus(); t.select(); }
      }, 80);
    };
    window.editChapter = function (bid, cid) {
      // 复用保存按钮 — 直接聚焦正文
      closeChPop();
      setTimeout(() => $('#w_body')?.focus(), 50);
    };
    window.renameChapter = function (bid, cid) {
      closeChPop();
      const chs = getAllChapters()[bid] || [];
      const c = chs.find(x => x.id === cid);
      if (!c) return;
      const t = prompt('新标题', c.title);
      if (t === null) return;
      const trimmed = t.trim() || c.title;
      const isBuiltIn = (CHAPTERS[bid] || []).some(x => x.id === cid);
      if (isBuiltIn) {
        const ov = loadOverrides();
        ov.updates = ov.updates || {};
        ov.updates[cid] = Object.assign({}, ov.updates[cid] || {}, { title: trimmed });
        saveOverrides(ov);
      } else {
        const extra = loadExtraChapters();
        const list = extra[bid] || [];
        const i = list.findIndex(x => x.id === cid);
        if (i >= 0) { list[i].title = trimmed; saveExtraChapters(extra); }
      }
      toast('已重命名');
      render(workspace(), { hideTab: true });
    };
    window.delChapter = function (bid, cid) {
      closeChPop();
      if (!confirm('确认删除该章节？')) return;
      const isBuiltIn = (CHAPTERS[bid] || []).some(x => x.id === cid);
      if (isBuiltIn) {
        const ov = loadOverrides();
        ov.removed = ov.removed || {};
        (ov.removed[bid] = ov.removed[bid] || []).push(cid);
        if (ov.updates) delete ov.updates[cid];
        saveOverrides(ov);
      } else {
        const extra = loadExtraChapters();
        if (extra[bid]) {
          extra[bid] = extra[bid].filter(c => c.id !== cid);
          saveExtraChapters(extra);
        }
      }
      if (_currentChapterId === cid) {
        const remaining = (getAllChapters()[bid] || []);
        _currentChapterId = remaining[0]?.id || null;
      }
      toast('已删除');
      render(workspace(), { hideTab: true });
    };

    /* === 自动保存 / 手动保存 === */
    let _saveTimer = null;
    window.quickSave = function () {
      if (!_currentBookId || !_currentChapterId) return;
      const title = $('#w_title')?.value || '';
      const text  = $('#w_body')?.value || '';
      const isBuiltIn = (CHAPTERS[_currentBookId] || []).some(x => x.id === _currentChapterId);
      if (isBuiltIn) {
        const ov = loadOverrides();
        ov.updates = ov.updates || {};
        ov.updates[_currentChapterId] = { title, text };
        saveOverrides(ov);
      } else {
        const extra = loadExtraChapters();
        const list = extra[_currentBookId] || [];
        const i = list.findIndex(x => x.id === _currentChapterId);
        if (i >= 0) {
          list[i].title = title;
          list[i].text = text;
          saveExtraChapters(extra);
        } else {
          // 不在列表里就加进去
          list.push({ id: _currentChapterId, title, text });
          extra[_currentBookId] = list;
          saveExtraChapters(extra);
        }
      }
      const ss = $('#save_state');
      if (ss) { ss.textContent = '已保存'; ss.className = 'save-state saved'; }
    };
    function markDirty() {
      const ss = $('#save_state');
      if (ss) { ss.textContent = '编辑中…'; ss.className = 'save-state dirty'; }
    }

    window.logoutAuthor = function () {
      quickSave();
      CURRENT_USER.role = null;
      CURRENT_USER.name = '游客';
      CURRENT_USER.authorId = null;
      saveUser();
      _currentBookId = null;
      _currentChapterId = null;
      // 跳回读者端首页（未登录会自动跳到登录页）
      location.href = 'index.html';
    };

    function render(html) {
      APP_BODY().innerHTML = html;
      APP_BODY().scrollTop = 0;
      const tb = $('#tab-bar');
      if (tb) tb.style.display = 'none';
      APP_BODY().style.paddingBottom = '0';
      // 绑定写作区事件
      bindWriteEvents();
    }
    function bindWriteEvents() {
      const titleEl = $('#w_title');
      const bodyEl  = $('#w_body');
      if (!titleEl || !bodyEl) return;
      const handler = () => {
        markDirty();
        // 2 秒无操作自动保存
        clearTimeout(_saveTimer);
        _saveTimer = setTimeout(quickSave, 2000);
        // 实时字数显示
        const cnt = document.querySelectorAll('.a-footbar span')[1];
        if (cnt && cnt.previousSibling?.nodeType !== 3) cnt.textContent = wordCount(bodyEl.value) + ' 字';
      };
      titleEl.addEventListener('input', handler);
      bodyEl.addEventListener('input', handler);
    }

    /* === 启动 === */
    document.addEventListener('DOMContentLoaded', () => {
      if (CURRENT_USER.role !== 'author') {
        render(loginGate(), { hideTab: true });
      } else {
        render(workspace(), { hideTab: true });
      }
    });
  </script>
</body>
</html>
